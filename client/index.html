<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary viewport — viewport-fit=cover for iPhone notch / Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>CooLink - Daily-Wage Worker Marketplace | തൊഴിലാളി മാർക്കറ്റ്</title>
    <meta name="description" content="CooLink connects verified daily-wage workers (masons, electricians, plumbers, carpenters) with contractors and homeowners across Kerala, India." />
    <meta name="theme-color" content="#2563eb" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />

    <!-- Apple PWA / iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CooLink" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Apple Splash Screens (portrait, common iPhone sizes) -->
    <meta name="apple-touch-startup-image" content="/icons/icon-512.png" />

    <!-- Microsoft Tiles (Windows/Edge) -->
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />

    <!-- Open Graph (WhatsApp / Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CooLink - Daily-Wage Worker Marketplace" />
    <meta property="og:description" content="Find verified masons, electricians, plumbers and more in Kerala. Zero middleman. Real-time availability." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manjari:wght@400;700&display=swap" rel="stylesheet">

    <style>
      /* Prevent iOS Safari flash of unstyled content */
      html { background-color: #f8fafc; }

      /* iOS safe-area support for bottom nav (Dynamic Island / Home Indicator) */
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }

      /* Prevent text size adjustment on iOS rotation */
      body { -webkit-text-size-adjust: 100%; }

      /* Smooth scroll on iOS */
      html { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
