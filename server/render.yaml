services:
  - type: web
    name: coolink-backend-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: OTP_CHANNEL
        value: EMAIL
      - key: EMAIL_PROVIDER
        value: RESEND
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: CooLink <onboarding@resend.dev>
      - key: ADMIN_SETUP_KEY
        generateValue: true
